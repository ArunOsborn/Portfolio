<main>
	<header class="header">
		<h2>Drinkage 1.4.6 Port</h2>
		<button
			mat-icon-button
			type="button"
			aria-label="Open game settings"
			[disabled]="isLoadingCards() || cardLoadError()"
			(click)="openSettingsDialog()"
		>
			<mat-icon>settings</mat-icon>
		</button>
	</header>

	@if (cardLoadError()) {
		<p role="alert">Game cards could not be loaded.</p>
		<button mat-stroked-button type="button" (click)="loadCardPack()">Retry loading cards</button>
	}

	<div
		class="card"
		#card
		(pointerdown)="onPointerDown($event)"
		(pointermove)="onPointerMove($event)"
		(pointerup)="onPointerUp($event)"
		(pointercancel)="onPointerCancel($event)"
		[style.transform]="cardTransform()"
		[style.transition]="cardTransition()"
	>
		<p [innerHTML]="cardContent()"></p>
		@for (btn of cardButtons(); track $index) {
			<button type="button" (click)="btn.action()">{{ btn.label }}</button>
		}
	</div>

	<button
		mat-flat-button
		id="next-button"
		type="button"
		[disabled]="isLoadingCards() || cardLoadError()"
		(click)="nextCard()"
	>
		{{ isLoadingCards() ? 'Loading cards...' : 'Next' }}
	</button>

	<section id="names" aria-labelledby="players-title">
		<h3 id="players-title">Players</h3>
		@for (name of names(); track $index) {
			<div class="confirmed-box">
				<span>{{ name }}</span>
				<button
					mat-icon-button
					type="button"
					[attr.aria-label]="'Remove ' + name"
					(click)="removeName($index)"
				>
					<mat-icon>close</mat-icon>
				</button>
			</div>
		}
	</section>

	<form (ngSubmit)="addName()" id="name-form">
		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Player name</mat-label>
			<input matInput type="text" [formControl]="nameControl" autocomplete="off" />
		</mat-form-field>
		<button mat-icon-button type="submit" aria-label="Add player">
			<mat-icon>add_circle</mat-icon>
		</button>
	</form>
</main>

<footer>
	<i>3/12/2025, A Creation by <strong>Arun Osborn</strong></i>
</footer>
